<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <title>Formulario de Reclamos</title>
  <style>
    :root {
      --bg: #eef2f7;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #d1d5db;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --radius: 10px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 12px;
      font-size: 13px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      border: 1px solid #e5e7eb;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 20px;
    }

    .subtitle {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .field {
      margin-bottom: 10px;
    }

    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 600;
      font-size: 12px;
    }

    select,
    input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      height: 32px;
      background: #fff;
      outline: none;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .footer {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .genesys-user {
      padding: 8px 10px;
      border-radius: 8px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      font-size: 12px;
    }

    .debug-panel {
      padding: 10px;
      border-radius: 8px;
      background: #071533;
      color: #e5e7eb;
      border: 1px solid #0f274f;
      font-size: 12px;
      font-family: Consolas, Monaco, monospace;
      white-space: pre-wrap;
      max-height: 260px;
      overflow: auto;
      line-height: 1.45;
    }

    .debug-title {
      color: #93c5fd;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
    }

    button {
      border: none;
      background: var(--primary);
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      height: 34px;
    }

    button:hover {
      background: var(--primary-hover);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    @media (max-width: 640px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>

</head>

    function buildPayload() {
      const tipo = tipoGestionEl.value;
      const nombreCapturado = getFieldValue('nombre');
      const telefonoCapturado = getFieldValue('telefono');
      const nombreAsesorCapturado = getFieldValue('nombreAsesor');
      const mensajeOpcionalCapturado = getFieldValue('mensajeOpcional');

      const nroDocCapturado = getFieldValue('nroDoc');
      const fechaCapturada = getFieldValue('fecha');
      const horarioCapturado = getFieldValue('horario');

      let datoPayload;

      if (tipo === 'referidos_cat' || tipo === 'referidos_tp' || tipo === 'referidos_apex') {
        datoPayload = {
          C1: nombreCapturado || '',
          C2: mensajeOpcionalCapturado || '',
          C3: fechaCapturada || '',
          C4: horarioCapturado || '',
          C5: telefonoCapturado || ''
        };
      }
      
      if (tipo === 'reclamo_finalizado' || tipo === 'reclamo_pendiente' || tipo === 'reclamo_pendiente_organismos') {
        datoPayload = {
          C1: nombreCapturado || '',
          C2: nombreAsesorCapturado || '',
          C3: idGestionCapturado || '',
          C4: nroDocCapturado || ''
        };
      }

      if (tipo === 'isla_altovalortop_smb' || tipo === 'contacto_altovalor' || tipo === 'catityapoderadoisla_smb' || tipo === 'convergentenounificadoisla_smb' || tipo === 'contactoislaconvynofan_smb' || tipo === 'contacto_isladegradados_smb' || tipo === 'contacto_esim_smb' || tipo === 'facturaunificadaisla_smb' || tipo === 'islahightech_smb' || tipo === 'islamigra_smb' || tipo === 'contactoonboarding_smb' || tipo === 'contacto_retencion_smb' || tipo === 'soportetecnifofan_smb' || tipo === 'soportetecnicolegados_smb' || tipo === 'solucionesdigitales_smb') {
        datoPayload = {
          C1: nombreCapturado || '',
          C2: idGestionCapturado || '',
          C3: mensajeOpcionalCapturado || ''
        };
      }

      if (tipo === 'tkcompraonboardingcu_smb') {
        datoPayload = {
          C1: nroDocCapturado || '',
          C2: nombreCapturado || '',
          C3: fechaCapturada || ''
        };
      }

      if (tipo === 'regularizacion_cuil_smb') {
        datoPayload = {
          C1: nroDocCapturado || ''
        };
      }

      return {
        id: getIdByTipo(tipo),
        name: getActionNameByTipo(tipo),
        from: '5491180312371',
        to: telefonoCapturado || '',
        dato: JSON.stringify(datoPayload)
      };
    }

    async function initGenesys() {
      try {
        logDebug('Inicializando Genesys Cloud');

        const platformClient = window.platformClient || (window.require ? window.require('platformClient') : null);

          throw new Error('No se encontró platformClient en la página');
        }

        apiClient = platformClient.ApiClient.instance;
        const usersApi = new platformClient.UsersApi();

        regionHost = platformClient.PureCloudRegionHosts[CONFIG.environmentKey];
        if (!regionHost) {
          throw new Error('No se encontró la región en PureCloudRegionHosts: ' + CONFIG.environmentKey);

          selectOption.value = "tkcompraonboardingcu_smb";
          selectOption.text = "[tkcompraonboardingcu_smb]";
          selectTemplate.add(selectOption);
        }
      } catch (error) {
        console.error(error);
        genesysUserEl.textContent = 'Error: ' + (error.message || String(error));
        logDebug('Error al inicializar Genesys', {
          message: error.message,
          stack: error.stack
        });
      }
    }

    async function executeDataAction() {
      const values = getFormValues();
      logDebug('Formulario actual', values);

      if (!values.telefono) {
        throw new Error('El campo Numero de Telefono es obligatorio');
      }

      if (!apiClient) {
        throw new Error('ApiClient no inicializado');
      }

      const token = apiClient.authData && apiClient.authData.accessToken;
      if (!token) {
        throw new Error('No se encontró access token');
      }

      const payload = buildPayload();
      const apiHost = regionHost.startsWith('api.') ? regionHost : `api.${regionHost}`;
      const url = `https://${apiHost}/api/v2/integrations/actions/${CONFIG.dataActionId}/execute`;

      logDebug('Ejecutando Data Action', {
        url,
        actionId: CONFIG.dataActionId,
        payload
      });

      const response = await fetch(url, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });

      const rawText = await response.text();
      let parsedBody;
      try {
        parsedBody = rawText ? JSON.parse(rawText) : null;
      } catch (e) {
        parsedBody = rawText;
      }

      logDebug('Respuesta HTTP del Data Action', {
        ok: response.ok,
        status: response.status,
        statusText: response.statusText,
        body: parsedBody
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status} ${response.statusText}`);
      }

      return parsedBody;
    }

    async function onAceptarClick() {
      btnAceptarEl.disabled = true;
      try {
        logDebug('Botón Aceptar presionado');
        const result = await executeDataAction();
        logDebug('Data Action ejecutado correctamente', result);
        alert('Data Action ejecutado correctamente. Revisa el panel Debug.');
      } catch (error) {
        console.error(error);
        logDebug('Error al ejecutar el Data Action', {
          message: error.message,
          stack: error.stack
        });
        alert('Error al ejecutar el Data Action. Revisa Debug y consola.');
      } finally {
        btnAceptarEl.disabled = false;
      }
    }

    tipoGestionEl.addEventListener('change', (event) => {
      renderFields(event.target.value);
      logDebug('Tipo cambiado', {
        tipo: event.target.value,
        dataActionName: getActionNameByTipo(event.target.value),
        dataActionId: getIdByTipo(event.target.value)
      });
    });

    btnAceptarEl.addEventListener('click', onAceptarClick);

    renderFields(tipoGestionEl.value);
    logDebug('Formulario renderizado', {
      tipoInicial: tipoGestionEl.value,
      dataActionNameInicial: getActionNameByTipo(tipoGestionEl.value),
      dataActionIdInicial: getIdByTipo(tipoGestionEl.value)
    });

    window.addEventListener('load', initGenesys);
  </script>
</body>
</html>
